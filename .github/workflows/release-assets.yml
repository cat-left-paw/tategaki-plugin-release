name: Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example 1.3.1
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check manifest version matches tag
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$VERSION" != "${{ inputs.tag }}" ]; then
            echo "manifest.json version ($VERSION) does not match tag (${{ inputs.tag }})"
            exit 1
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" main.js manifest.json styles.css --clobber

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
